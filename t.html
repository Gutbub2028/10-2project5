<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب درجة الحرارة</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="c" type="text" placeholder="(J/kg·K) السعة الحرارية"></input>
    <input id="m" type="text" placeholder="(kg) الكتلة"></input>
    <input id="q" type="text" placeholder="(J) الكمية الحرارية"></input>
    <input id="delta_t" type="text" placeholder="(K) تغير درجة الحرارة"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const cEl = document.getElementById('c');
      const mEl = document.getElementById('m');
      const qEl = document.getElementById('q');
      const deltaTEl = document.getElementById('delta_t');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const cVal = cEl.value.trim();
        const mVal = mEl.value.trim();
        const qVal = qEl.value.trim();
        const deltaTVal = deltaTEl.value.trim();

        const cNum = parseNum(cVal);
        const mNum = parseNum(mVal);
        const qNum = parseNum(qVal);
        const deltaTNum = parseNum(deltaTVal);

        const filled = [!isEmpty(cVal), !isEmpty(mVal), !isEmpty(qVal), !isEmpty(deltaTVal)].filter(Boolean).length;
        if(filled < 3){
          showResult('الرجاء إدخال ثلاث قيم على الأقل لحساب الرابعة.');
          return;
        }

        // Calculate heat capacity (c = Q/(m*ΔT))
        if(isEmpty(cVal) && qNum !== null && mNum !== null && deltaTNum !== null){
          if(mNum === 0 || deltaTNum === 0){
            showResult('خطأ: الكتلة أو تغير درجة الحرارة لا يمكن أن يكون صفر');
            return;
          }
          const heatCapacity = qNum / (mNum * deltaTNum);
          cEl.value = formatNumber(heatCapacity);
          showResult(`السعة الحرارية = ${formatNumber(heatCapacity)} J/kg·K`);
          return;
        }

        // Calculate mass (m = Q/(c*ΔT))
        if(isEmpty(mVal) && qNum !== null && cNum !== null && deltaTNum !== null){
          if(cNum === 0 || deltaTNum === 0){
            showResult('خطأ: السعة الحرارية أو تغير درجة الحرارة لا يمكن أن يكون صفر');
            return;
          }
          const mass = qNum / (cNum * deltaTNum);
          mEl.value = formatNumber(mass);
          showResult(`الكتلة = ${formatNumber(mass)} kg`);
          return;
        }

        // Calculate heat quantity (Q = m*c*ΔT)
        if(isEmpty(qVal) && mNum !== null && cNum !== null && deltaTNum !== null){
          const heat = mNum * cNum * deltaTNum;
          qEl.value = formatNumber(heat);
          showResult(`الكمية الحرارية = ${formatNumber(heat)} J`);
          return;
        }

        // Calculate temperature change (ΔT = Q/(m*c))
        if(isEmpty(deltaTVal) && qNum !== null && mNum !== null && cNum !== null){
          if(mNum === 0 || cNum === 0){
            showResult('خطأ: الكتلة أو السعة الحرارية لا يمكن أن تكون صفر');
            return;
          }
          const tempChange = qNum / (mNum * cNum);
          deltaTEl.value = formatNumber(tempChange);
          showResult(`تغير درجة الحرارة = ${formatNumber(tempChange)} K`);
          return;
        }

        // all four provided -> validate
        if(cNum !== null && mNum !== null && qNum !== null && deltaTNum !== null){
          const expectedQ = mNum * cNum * deltaTNum;
          if(Math.abs(expectedQ - qNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع Q = m*c*ΔT');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        cEl.value = '';
        mEl.value = '';
        qEl.value = '';
        deltaTEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [cEl, mEl, qEl, deltaTEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
