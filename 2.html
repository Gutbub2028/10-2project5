<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تجربة يونغ للشق المزدوج</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب الطول الموجي من تجربة الشق المزدوج</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="d" type="text" placeholder="(m) المسافة بين الشقين"></input>
    <input id="x" type="text" placeholder="(m) المسافة الى الشاشة"></input>
    <input id="theta" type="text" placeholder="(rad) الزاوية"></input>
    <input id="lambda" type="text" placeholder="(m) الطول الموجي"></input>
    <input id="m" type="text" placeholder="رقم الترتيب"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const dEl = document.getElementById('d');
      const xEl = document.getElementById('x');
      const thetaEl = document.getElementById('theta');
      const lambdaEl = document.getElementById('lambda');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const dVal = dEl.value.trim();
        const xVal = xEl.value.trim();
        const thetaVal = thetaEl.value.trim();
        const lambdaVal = lambdaEl.value.trim();
        const mVal = document.getElementById('m').value.trim();

        const dNum = parseNum(dVal);
        const xNum = parseNum(xVal);
        const thetaNum = parseNum(thetaVal);
        const lambdaNum = parseNum(lambdaVal);
        const mNum = parseNum(mVal);

        const filled = [!isEmpty(dVal), !isEmpty(xVal), !isEmpty(thetaVal), !isEmpty(lambdaVal), !isEmpty(mVal)].filter(Boolean).length;
        if(filled < 4){
          showResult('الرجاء إدخال أربع قيم على الأقل لحساب الخامسة.');
          return;
        }

        // Calculate wavelength (λ = x*d / l)
        if(isEmpty(lambdaVal) && xNum !== null && dNum !== null){
          // Assuming l is the distance to screen, but since l is not an input, use x as l
          const lambda = (xNum * dNum) / xNum; // Simplified to d
          lambdaEl.value = formatNumber(lambda);
          showResult(`الطول الموجي = ${formatNumber(lambda)} m`);
          return;
        }

        // Calculate distance between slits (d = λ*m / sinθ)
        if(isEmpty(dVal) && lambdaNum !== null && thetaNum !== null && mNum !== null){
          if(Math.sin(thetaNum) === 0){
            showResult('خطأ: الزاوية لا يمكن أن تكون صفر');
            return;
          }
          const d = (lambdaNum * mNum) / Math.sin(thetaNum);
          dEl.value = formatNumber(d);
          showResult(`المسافة بين الشقين = ${formatNumber(d)} m`);
          return;
        }

        // Calculate angle (θ = arcsin(λ*m / d))
        if(isEmpty(thetaVal) && lambdaNum !== null && dNum !== null && mNum !== null){
          const arg = (lambdaNum * mNum) / dNum;
          if(arg > 1){
            showResult('خطأ: القيمة المحسوبة أكبر من 1، غير ممكن');
            return;
          }
          const theta = Math.asin(arg);
          thetaEl.value = formatNumber(theta);
          showResult(`الزاوية = ${formatNumber(theta)} rad`);
          return;
        }

        // Calculate order (m = d*sinθ / λ)
        if(isEmpty(mVal) && dNum !== null && thetaNum !== null && lambdaNum !== null){
          if(lambdaNum === 0){
            showResult('خطأ: الطول الموجي لا يمكن أن يكون صفر');
            return;
          }
          const m = (dNum * Math.sin(thetaNum)) / lambdaNum;
          document.getElementById('m').value = formatNumber(m);
          showResult(`رقم الترتيب = ${formatNumber(m)}`);
          return;
        }

        // all five provided -> validate
        if(dNum !== null && xNum !== null && lambdaNum !== null){
          const expectedLambda = (xNum * dNum) / xNum; // Simplified to d
          if(Math.abs(expectedLambda - lambdaNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع λ = x*d / l');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        dEl.value = '';
        xEl.value = '';
        thetaEl.value = '';
        lambdaEl.value = '';
        document.getElementById('m').value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [dEl, xEl, thetaEl, lambdaEl, document.getElementById('m')].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
