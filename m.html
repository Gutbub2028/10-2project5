<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب قانون مالوس</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="i0" type="text" placeholder="(W/m²) شدة الضوء الأولية"></input>
    <input id="i" type="text" placeholder="(W/m²) شدة الضوء المرورية"></input>
    <input id="theta" type="text" placeholder="(rad) الزاوية"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const i0El = document.getElementById('i0');
      const iEl = document.getElementById('i');
      const thetaEl = document.getElementById('theta');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const i0Val = i0El.value.trim();
        const iVal = iEl.value.trim();
        const thetaVal = thetaEl.value.trim();

        const i0Num = parseNum(i0Val);
        const iNum = parseNum(iVal);
        const thetaNum = parseNum(thetaVal);

        const filled = [!isEmpty(i0Val), !isEmpty(iVal), !isEmpty(thetaVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate transmitted intensity (I = I₀*cos²θ)
        if(isEmpty(iVal) && i0Num !== null && thetaNum !== null){
          const intensity = i0Num * Math.cos(thetaNum) * Math.cos(thetaNum);
          iEl.value = formatNumber(intensity);
          showResult(`شدة الضوء المرورية = ${formatNumber(intensity)} W/m²`);
          return;
        }

        // Calculate initial intensity (I₀ = I/cos²θ)
        if(isEmpty(i0Val) && iNum !== null && thetaNum !== null){
          const cosTheta = Math.cos(thetaNum);
          if(cosTheta === 0){
            showResult('خطأ: الزاوية لا يمكن أن تكون 90 درجة');
            return;
          }
          const initialIntensity = iNum / (cosTheta * cosTheta);
          i0El.value = formatNumber(initialIntensity);
          showResult(`شدة الضوء الأولية = ${formatNumber(initialIntensity)} W/m²`);
          return;
        }

        // Calculate angle (θ = arccos(√(I/I₀)))
        if(isEmpty(thetaVal) && iNum !== null && i0Num !== null){
          if(i0Num === 0){
            showResult('خطأ: شدة الضوء الأولية لا يمكن أن تكون صفر');
            return;
          }
          if(iNum > i0Num){
            showResult('خطأ: شدة الضوء المرورية لا يمكن أن تكون أكبر من الأولية');
            return;
          }
          const cosTheta = Math.sqrt(iNum / i0Num);
          const angle = Math.acos(cosTheta);
          thetaEl.value = formatNumber(angle);
          showResult(`الزاوية = ${formatNumber(angle)} rad`);
          return;
        }

        // all three provided -> validate
        if(i0Num !== null && iNum !== null && thetaNum !== null){
          const expectedI = i0Num * Math.cos(thetaNum) * Math.cos(thetaNum);
          if(Math.abs(expectedI - iNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع قانون مالوس I = I₀*cos²θ');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        i0El.value = '';
        iEl.value = '';
        thetaEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [i0El, iEl, thetaEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
