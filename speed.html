<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حساب السرعة</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <header>
    <a href="calcu.html">الصفحة الرئيسة</a>
  </header>
  <h2>حساب السرعة</h2>
  <p>ادخل المعطيات و اذا تريد حساب قيمة اجعل خانتها فارغة</p>
  <div>
    <label for="v">السرعة:</label>
    <input id="v" type="text" placeholder="(m/s) السرعة">
    <label for="d">المسافة:</label>
    <input id="d" type="text" placeholder="(m) المسافة">
    <label for="t">الزمن:</label>
    <input id="t" type="text" placeholder="(s) الزمن">
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
  </div>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
  <script>
    (function(){
      // consistent element variable names
      const vEl = document.getElementById('v');
      const dEl = document.getElementById('d');
      const tEl = document.getElementById('t');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const vVal = vEl.value.trim();
        const dVal = dEl.value.trim();
        const tVal = tEl.value.trim();

        const vNum = parseNum(vVal);
        const dNum = parseNum(dVal);
        const tNum = parseNum(tVal);

        const filled = [!isEmpty(vVal), !isEmpty(dVal), !isEmpty(tVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // v missing -> v = d / t
        if(isEmpty(vVal) && dNum !== null && tNum !== null){
          if(tNum === 0){ showResult('الزمن لا يمكن أن يكون صفرًا.'); return; }
          const V = dNum / tNum;
          vEl.value = formatNumber(V);
          showResult(`السرعة = ${formatNumber(V)} م/ث`);
          return;
        }

        // d missing -> d = v * t
        if(isEmpty(dVal) && vNum !== null && tNum !== null){
          const res = vNum * tNum;
          dEl.value = formatNumber(res);
          showResult(`الازاحة = ${formatNumber(res)} م`);
          return;
        }

        // t missing -> t = d / v
        if(isEmpty(tVal) && dNum !== null && vNum !== null){
          if(vNum === 0){ showResult('السرعة لا يمكن أن تكون صفرًا لحساب الزمن.'); return; }
          const res = dNum / vNum;
          tEl.value = formatNumber(res);
          showResult(`الزمن = ${formatNumber(res)} ث`);
          return;
        }

        // all three provided -> validate and show computed v
        if(vNum !== null && dNum !== null && tNum !== null){
          if(tNum === 0){ showResult('الزمن لا يمكن أن يكون صفرًا.'); return; }
          const expectedV = dNum / tNum;
          showResult(`السرعة المدخلة = ${formatNumber(vNum)} م/ث ؛ السرعة من d/t = ${formatNumber(expectedV)} م/ث`);
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        vEl.value = '';
        dEl.value = '';
        tEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [vEl, dEl, tEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script>

</body>
</html></style>
