<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب الشغل </h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="W" type="text" placeholder=" (J) الشغل">الشغل</input>
    <input id="F" type="text" placeholder=" (N)القوة ">القوة</input>
    <input id="d" type="text" placeholder="(m) الازاحة">الازاحة</input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
<script>
    (function(){
    const W = document.getElementById('W');
    const F = document.getElementById('F');
    const d = document.getElementById('d');
    const sBtn = document.getElementById('s');
    const rBtn = document.getElementById('r');
    function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
    }
    function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
    }
    function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
    }
    function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        return parseFloat(n.toFixed(6)).toString();
    }
     function compute(){
        const Wv = W.value.trim();
        const Fv = F.value.trim();
        const dv = d.value.trim();

        const Wn = parseNum(Wv);
        const Fn = parseNum(Fv);
        const dn = parseNum(dv);

        const filled = [!isEmpty(Wv), !isEmpty(Fv), !isEmpty(dv)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        if(isEmpty(Wv) && Fn !== null && dn !== null){
          const w = Fn * dn;
          W.value = formatNumber(w);
          showResult(`الشغل = ${formatNumber(w)} J`);
          return;
        }

        if(isEmpty(Fv) && Wn !== null && dn !== null){
          const res = Wn / dn;
          F.value = formatNumber(res);
          showResult(`القوة = ${formatNumber(res)} N`);
          return;
        }

        if(isEmpty(dv) && Wn !== null && Fn !== null){
          const res = Wn / Fn;
          d.value = formatNumber(res);
          showResult(`الازاحة = ${formatNumber(res)} m`);
          return;
        }

        if(Wn !== null && Fn !== null && dn !== null){
          if(dn === 0){ 
            showResult('خطأ: الازاحة لا يمكن أن تكون صفر'); 
            return; 
          }
          const calculated = Fn * dn;
          if(Math.abs(calculated - Wn) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع قانون الشغل W = F × d');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        W.value = '';
        F.value = '';
        d.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [W, F, d].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();

</script>
    </style>
