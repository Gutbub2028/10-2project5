<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسية</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حساب المقاومة</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب المقاومة: R = ρ × L / A</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="r" type="text" placeholder="(Ω) المقاومة"></input>
    <input id="rho" type="text" placeholder="(Ω·m) المقاومة النوعية"></input>
    <input id="l" type="text" placeholder="(m) الطول"></input>
    <input id="a" type="text" placeholder="(m²) المقطع العرضي"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="reset" type="button" value="اعادة">
</p>
<a href="static.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const rEl = document.getElementById('r');
      const rhoEl = document.getElementById('rho');
      const lEl = document.getElementById('l');
      const aEl = document.getElementById('a');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('reset');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const rVal = rEl.value.trim();
        const rhoVal = rhoEl.value.trim();
        const lVal = lEl.value.trim();
        const aVal = aEl.value.trim();

        const rNum = parseNum(rVal);
        const rhoNum = parseNum(rhoVal);
        const lNum = parseNum(lVal);
        const aNum = parseNum(aVal);

        const filled = [!isEmpty(rVal), !isEmpty(rhoVal), !isEmpty(lVal), !isEmpty(aVal)].filter(Boolean).length;
        if(filled < 3){
          showResult('الرجاء إدخال ثلاث قيم على الأقل لحساب الرابعة.');
          return;
        }

        // Calculate resistance (R = ρ * L / A)
        if(isEmpty(rVal) && rhoNum !== null && lNum !== null && aNum !== null){
          if(aNum === 0){
            showResult('خطأ: المقطع العرضي لا يمكن أن يكون صفر');
            return;
          }
          const resistance = rhoNum * lNum / aNum;
          rEl.value = formatNumber(resistance);
          showResult(`المقاومة = ${formatNumber(resistance)} Ω`);
          return;
        }

        // Calculate resistivity (ρ = R * A / L)
        if(isEmpty(rhoVal) && rNum !== null && aNum !== null && lNum !== null){
          if(lNum === 0){
            showResult('خطأ: الطول لا يمكن أن يكون صفر');
            return;
          }
          const resistivity = rNum * aNum / lNum;
          rhoEl.value = formatNumber(resistivity);
          showResult(`المقاومة النوعية = ${formatNumber(resistivity)} Ω·m`);
          return;
        }

        // Calculate length (L = R * A / ρ)
        if(isEmpty(lVal) && rNum !== null && aNum !== null && rhoNum !== null){
          if(rhoNum === 0){
            showResult('خطأ: المقاومة النوعية لا يمكن أن تكون صفر');
            return;
          }
          const length = rNum * aNum / rhoNum;
          lEl.value = formatNumber(length);
          showResult(`الطول = ${formatNumber(length)} m`);
          return;
        }

        // Calculate area (A = ρ * L / R)
        if(isEmpty(aVal) && rhoNum !== null && lNum !== null && rNum !== null){
          if(rNum === 0){
            showResult('خطأ: المقاومة لا يمكن أن تكون صفر');
            return;
          }
          const area = rhoNum * lNum / rNum;
          aEl.value = formatNumber(area);
          showResult(`المقطع العرضي = ${formatNumber(area)} m²`);
          return;
        }

        // all four provided -> validate
        if(rNum !== null && rhoNum !== null && lNum !== null && aNum !== null){
          const expectedR = rhoNum * lNum / aNum;
          if(Math.abs(expectedR - rNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع R = ρ×L/A');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        rEl.value = '';
        rhoEl.value = '';
        lEl.value = '';
        aEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [rEl, rhoEl, lEl, aEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
 </script>
</body>
</html></style>
