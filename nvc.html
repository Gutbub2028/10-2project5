<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب معامل الانكسار</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="n" type="text" placeholder="معامل الانكسار"></input>
    <input id="v" type="text" placeholder="(m/s) سرعة الضوء في الوسط"></input>
    <input id="c" type="text" placeholder="(m/s) سرعة الضوء في الفراغ" value="299792458"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const nEl = document.getElementById('n');
      const vEl = document.getElementById('v');
      const cEl = document.getElementById('c');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const nVal = nEl.value.trim();
        const vVal = vEl.value.trim();
        const cVal = cEl.value.trim();

        const nNum = parseNum(nVal);
        const vNum = parseNum(vVal);
        const cNum = parseNum(cVal);

        const filled = [!isEmpty(nVal), !isEmpty(vVal), !isEmpty(cVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate refractive index (n = c/v)
        if(isEmpty(nVal) && cNum !== null && vNum !== null){
          if(vNum === 0){
            showResult('خطأ: سرعة الضوء في الوسط لا يمكن أن تكون صفر');
            return;
          }
          const refractiveIndex = cNum / vNum;
          nEl.value = formatNumber(refractiveIndex);
          showResult(`معامل الانكسار = ${formatNumber(refractiveIndex)}`);
          return;
        }

        // Calculate speed in medium (v = c/n)
        if(isEmpty(vVal) && cNum !== null && nNum !== null){
          if(nNum === 0){
            showResult('خطأ: معامل الانكسار لا يمكن أن يكون صفر');
            return;
          }
          const speed = cNum / nNum;
          vEl.value = formatNumber(speed);
          showResult(`سرعة الضوء في الوسط = ${formatNumber(speed)} m/s`);
          return;
        }

        // Calculate speed of light in vacuum (c = n*v)
        if(isEmpty(cVal) && nNum !== null && vNum !== null){
          const speedOfLight = nNum * vNum;
          cEl.value = formatNumber(speedOfLight);
          showResult(`سرعة الضوء في الفراغ = ${formatNumber(speedOfLight)} m/s`);
          return;
        }

        // all three provided -> validate
        if(nNum !== null && vNum !== null && cNum !== null){
          const expectedN = cNum / vNum;
          if(Math.abs(expectedN - nNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع n = c/v');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        nEl.value = '';
        vEl.value = '';
        cEl.value = '299792458';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [nEl, vEl, cEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
