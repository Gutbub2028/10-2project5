<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسية</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حساب المعاوقة المغناطيسية</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب المعاوقة المغناطيسية: L = Φ / I</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="l" type="text" placeholder="(H) المعاوقة المغناطيسية"></input>
    <input id="phi" type="text" placeholder="(Wb) التدفق المغناطيسي"></input>
    <input id="i" type="text" placeholder="(A) التيار"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="static.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const lEl = document.getElementById('l');
      const phiEl = document.getElementById('phi');
      const iEl = document.getElementById('i');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const lVal = lEl.value.trim();
        const phiVal = phiEl.value.trim();
        const iVal = iEl.value.trim();

        const lNum = parseNum(lVal);
        const phiNum = parseNum(phiVal);
        const iNum = parseNum(iVal);

        const filled = [!isEmpty(lVal), !isEmpty(phiVal), !isEmpty(iVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate inductance (L = Φ / I)
        if(isEmpty(lVal) && phiNum !== null && iNum !== null){
          if(iNum === 0){
            showResult('خطأ: التيار لا يمكن أن يكون صفر');
            return;
          }
          const inductance = phiNum / iNum;
          lEl.value = formatNumber(inductance);
          showResult(`المعاوقة المغناطيسية = ${formatNumber(inductance)} H`);
          return;
        }

        // Calculate magnetic flux (Φ = L * I)
        if(isEmpty(phiVal) && lNum !== null && iNum !== null){
          const flux = lNum * iNum;
          phiEl.value = formatNumber(flux);
          showResult(`التدفق المغناطيسي = ${formatNumber(flux)} Wb`);
          return;
        }

        // Calculate current (I = Φ / L)
        if(isEmpty(iVal) && phiNum !== null && lNum !== null){
          if(lNum === 0){
            showResult('خطأ: المعاوقة المغناطيسية لا يمكن أن تكون صفر');
            return;
          }
          const current = phiNum / lNum;
          iEl.value = formatNumber(current);
          showResult(`التيار = ${formatNumber(current)} A`);
          return;
        }

        // all three provided -> validate
        if(lNum !== null && phiNum !== null && iNum !== null){
          const expectedL = phiNum / iNum;
          if(Math.abs(expectedL - lNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع L = Φ/I');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        lEl.value = '';
        phiEl.value = '';
        iEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [lEl, phiEl, iEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
 </script>
</body>
</html></style>
