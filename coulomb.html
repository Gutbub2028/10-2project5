<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسية</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>قانون كولوم</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>قانون كولوم: F = k × (q₁ × q₂) / r²</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="f" type="text" placeholder="(N) القوة الكهربائية"></input>
    <input id="q1" type="text" placeholder="(C) الشحنة الأولى"></input>
    <input id="q2" type="text" placeholder="(C) الشحنة الثانية"></input>
    <input id="r" type="text" placeholder="(m) المسافة"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="reset" type="button" value="اعادة">
</p>
<a href="static.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const fEl = document.getElementById('f');
      const q1El = document.getElementById('q1');
      const q2El = document.getElementById('q2');
      const rEl = document.getElementById('r');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('reset');

      const k = 9e9; // Coulomb's constant

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const fVal = fEl.value.trim();
        const q1Val = q1El.value.trim();
        const q2Val = q2El.value.trim();
        const rVal = rEl.value.trim();

        const fNum = parseNum(fVal);
        const q1Num = parseNum(q1Val);
        const q2Num = parseNum(q2Val);
        const rNum = parseNum(rVal);

        const filled = [!isEmpty(fVal), !isEmpty(q1Val), !isEmpty(q2Val), !isEmpty(rVal)].filter(Boolean).length;
        if(filled < 3){
          showResult('الرجاء إدخال ثلاث قيم على الأقل لحساب الرابعة.');
          return;
        }

        // Calculate force (F = k * q1 * q2 / r²)
        if(isEmpty(fVal) && q1Num !== null && q2Num !== null && rNum !== null){
          if(rNum === 0){
            showResult('خطأ: المسافة لا يمكن أن تكون صفر');
            return;
          }
          const force = k * q1Num * q2Num / (rNum * rNum);
          fEl.value = formatNumber(force);
          showResult(`القوة الكهربائية = ${formatNumber(force)} N`);
          return;
        }

        // Calculate first charge (q1 = F * r² / (k * q2))
        if(isEmpty(q1Val) && fNum !== null && q2Num !== null && rNum !== null){
          if(q2Num === 0){
            showResult('خطأ: الشحنة الثانية لا يمكن أن تكون صفر');
            return;
          }
          const charge1 = fNum * rNum * rNum / (k * q2Num);
          q1El.value = formatNumber(charge1);
          showResult(`الشحنة الأولى = ${formatNumber(charge1)} C`);
          return;
        }

        // Calculate second charge (q2 = F * r² / (k * q1))
        if(isEmpty(q2Val) && fNum !== null && q1Num !== null && rNum !== null){
          if(q1Num === 0){
            showResult('خطأ: الشحنة الأولى لا يمكن أن تكون صفر');
            return;
          }
          const charge2 = fNum * rNum * rNum / (k * q1Num);
          q2El.value = formatNumber(charge2);
          showResult(`الشحنة الثانية = ${formatNumber(charge2)} C`);
          return;
        }

        // Calculate distance (r = sqrt(k * q1 * q2 / F))
        if(isEmpty(rVal) && fNum !== null && q1Num !== null && q2Num !== null){
          if(fNum === 0){
            showResult('خطأ: القوة لا يمكن أن تكون صفر');
            return;
          }
          const distance = Math.sqrt(k * q1Num * q2Num / fNum);
          rEl.value = formatNumber(distance);
          showResult(`المسافة = ${formatNumber(distance)} m`);
          return;
        }

        // all four provided -> validate
        if(fNum !== null && q1Num !== null && q2Num !== null && rNum !== null){
          const expectedF = k * q1Num * q2Num / (rNum * rNum);
          if(Math.abs(expectedF - fNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع F = k×q₁×q₂/r²');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        fEl.value = '';
        q1El.value = '';
        q2El.value = '';
        rEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [fEl, q1El, q2El, rEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
 </script>
</body>
</html></style>
