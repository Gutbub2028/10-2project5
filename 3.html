<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>الطبقات الرقيقة</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب السمك</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="lambda" type="text" placeholder="(m) الطول الموجي"></input>
    <input id="n" type="text" placeholder="رقم الشريط"></input>
    <input id="theta" type="text" placeholder="(rad) الزاوية"></input>
    <input id="t" type="text" placeholder="(m) السمك"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const lambdaEl = document.getElementById('lambda');
      const nEl = document.getElementById('n');
      const thetaEl = document.getElementById('theta');
      const tEl = document.getElementById('t');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const lambdaVal = lambdaEl.value.trim();
        const nVal = nEl.value.trim();
        const thetaVal = thetaEl.value.trim();
        const tVal = tEl.value.trim();

        const lambdaNum = parseNum(lambdaVal);
        const nNum = parseNum(nVal);
        const thetaNum = parseNum(thetaVal);
        const tNum = parseNum(tVal);

        const filled = [!isEmpty(lambdaVal), !isEmpty(nVal), !isEmpty(thetaVal), !isEmpty(tVal)].filter(Boolean).length;
        if(filled < 3){
          showResult('الرجاء إدخال ثلاث قيم على الأقل لحساب الرابعة.');
          return;
        }

        // Calculate thickness (d = λ/(4*n))
        if(isEmpty(tVal) && lambdaNum !== null && nNum !== null){
          if(nNum === 0){
            showResult('خطأ: رقم الشريط لا يمكن أن يكون صفر');
            return;
          }
          const thickness = lambdaNum / (4 * nNum);
          tEl.value = formatNumber(thickness);
          showResult(`السمك = ${formatNumber(thickness)} m`);
          return;
        }

        // Calculate wavelength (λ = 4*n*t)
        if(isEmpty(lambdaVal) && tNum !== null && nNum !== null){
          const wavelength = 4 * nNum * tNum;
          lambdaEl.value = formatNumber(wavelength);
          showResult(`الطول الموجي = ${formatNumber(wavelength)} m`);
          return;
        }

        // Calculate order (n = λ/(4*t))
        if(isEmpty(nVal) && tNum !== null && lambdaNum !== null){
          if(tNum === 0){
            showResult('خطأ: السمك لا يمكن أن يكون صفر');
            return;
          }
          const order = lambdaNum / (4 * tNum);
          nEl.value = formatNumber(order);
          showResult(`رقم الشريط = ${formatNumber(order)}`);
          return;
        }

        // Calculate angle (θ = arcsin(λ*n / (2*t))) - keeping for compatibility, but not used in new formula
        if(isEmpty(thetaVal) && lambdaNum !== null && nNum !== null && tNum !== null){
          const arg = (lambdaNum * nNum) / (2 * tNum);
          if(arg > 1){
            showResult('خطأ: القيمة المحسوبة أكبر من 1، غير ممكن');
            return;
          }
          const angle = Math.asin(arg);
          thetaEl.value = formatNumber(angle);
          showResult(`الزاوية = ${formatNumber(angle)} rad`);
          return;
        }

        // all four provided -> validate
        if(lambdaNum !== null && nNum !== null && tNum !== null){
          const expectedT = lambdaNum / (4 * nNum);
          if(Math.abs(expectedT - tNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع d = λ/(4*n)');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        lambdaEl.value = '';
        nEl.value = '';
        thetaEl.value = '';
        tEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [lambdaEl, nEl, thetaEl, tEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
