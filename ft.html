<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب قوة التوتر</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="m" type="text" placeholder="(kg) الكتلة"></input>
    <input id="g" type="text" placeholder="(m/s²) تسارع الجاذبية" value="9.81"></input>
    <input id="t" type="text" placeholder="(N) قوة التوتر"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const mEl = document.getElementById('m');
      const gEl = document.getElementById('g');
      const tEl = document.getElementById('t');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const mVal = mEl.value.trim();
        const gVal = gEl.value.trim() || '9.81';
        const tVal = tEl.value.trim();

        const mNum = parseNum(mVal);
        const gNum = parseNum(gVal);
        const tNum = parseNum(tVal);

        const filled = [!isEmpty(mVal), !isEmpty(tVal)].filter(Boolean).length;
        if(filled < 1){
          showResult('الرجاء إدخال قيمة واحدة على الأقل لحساب القيمة الأخرى.');
          return;
        }

        // Calculate tension force (T = m*g)
        if(isEmpty(tVal) && mNum !== null){
          const tension = mNum * gNum;
          tEl.value = formatNumber(tension);
          showResult(`قوة التوتر = ${formatNumber(tension)} N`);
          return;
        }

        // Calculate mass (m = T/g)
        if(isEmpty(mVal) && tNum !== null){
          if(gNum === 0){
            showResult('خطأ: تسارع الجاذبية لا يمكن أن يكون صفر');
            return;
          }
          const mass = tNum / gNum;
          mEl.value = formatNumber(mass);
          showResult(`الكتلة = ${formatNumber(mass)} kg`);
          return;
        }

        // all three provided -> validate
        if(mNum !== null && tNum !== null){
          const expectedT = mNum * gNum;
          if(Math.abs(expectedT - tNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع T = m*g');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        mEl.value = '';
        gEl.value = '9.81';
        tEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [mEl, gEl, tEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
