<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب قانون الغاز</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="p" type="text" placeholder="(Pa) الضغط"></input>
    <input id="v" type="text" placeholder="(m³) الحجم"></input>
    <input id="n" type="text" placeholder="(mol) عدد المولات"></input>
    <input id="r" type="text" placeholder="(J/mol·K) ثابت الغازات" value="8.314"></input>
    <input id="t" type="text" placeholder="(K) درجة الحرارة"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="reset" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const pEl = document.getElementById('p');
      const vEl = document.getElementById('v');
      const nEl = document.getElementById('n');
      const rEl = document.getElementById('r');
      const tEl = document.getElementById('t');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('reset');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const pVal = pEl.value.trim();
        const vVal = vEl.value.trim();
        const nVal = nEl.value.trim();
        const rVal = rEl.value.trim() || '8.314';
        const tVal = tEl.value.trim();

        const pNum = parseNum(pVal);
        const vNum = parseNum(vVal);
        const nNum = parseNum(nVal);
        const rNum = parseNum(rVal);
        const tNum = parseNum(tVal);

        const filled = [!isEmpty(pVal), !isEmpty(vVal), !isEmpty(nVal), !isEmpty(tVal)].filter(Boolean).length;
        if(filled < 3){
          showResult('الرجاء إدخال ثلاث قيم على الأقل لحساب الرابعة.');
          return;
        }

        // Calculate pressure (P = nRT/V)
        if(isEmpty(pVal) && nNum !== null && rNum !== null && tNum !== null && vNum !== null){
          if(vNum === 0){
            showResult('خطأ: الحجم لا يمكن أن يكون صفر');
            return;
          }
          const pressure = (nNum * rNum * tNum) / vNum;
          pEl.value = formatNumber(pressure);
          showResult(`الضغط = ${formatNumber(pressure)} Pa`);
          return;
        }

        // Calculate volume (V = nRT/P)
        if(isEmpty(vVal) && nNum !== null && rNum !== null && tNum !== null && pNum !== null){
          if(pNum === 0){
            showResult('خطأ: الضغط لا يمكن أن يكون صفر');
            return;
          }
          const volume = (nNum * rNum * tNum) / pNum;
          vEl.value = formatNumber(volume);
          showResult(`الحجم = ${formatNumber(volume)} m³`);
          return;
        }

        // Calculate moles (n = PV/RT)
        if(isEmpty(nVal) && pNum !== null && vNum !== null && rNum !== null && tNum !== null){
          if(rNum === 0 || tNum === 0){
            showResult('خطأ: ثابت الغازات أو درجة الحرارة لا يمكن أن تكون صفر');
            return;
          }
          const moles = (pNum * vNum) / (rNum * tNum);
          nEl.value = formatNumber(moles);
          showResult(`عدد المولات = ${formatNumber(moles)} mol`);
          return;
        }

        // Calculate temperature (T = PV/nR)
        if(isEmpty(tVal) && pNum !== null && vNum !== null && nNum !== null && rNum !== null){
          if(nNum === 0 || rNum === 0){
            showResult('خطأ: عدد المولات أو ثابت الغازات لا يمكن أن يكون صفر');
            return;
          }
          const temperature = (pNum * vNum) / (nNum * rNum);
          tEl.value = formatNumber(temperature);
          showResult(`درجة الحرارة = ${formatNumber(temperature)} K`);
          return;
        }

        // all five provided -> validate
        if(pNum !== null && vNum !== null && nNum !== null && tNum !== null){
          const expectedP = (nNum * rNum * tNum) / vNum;
          if(Math.abs(expectedP - pNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع PV = nRT');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        pEl.value = '';
        vEl.value = '';
        nEl.value = '';
        rEl.value = '8.314';
        tEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [pEl, vEl, nEl, rEl, tEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
