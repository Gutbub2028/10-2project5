<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب مبدأ ارخميدس</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="rho" type="text" placeholder="(kg/m³) كثافة السائل"></input>
    <input id="v" type="text" placeholder="(m³) حجم الجسم المغمور"></input>
    <input id="f_b" type="text" placeholder="(N) قوة الطفو"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const rhoEl = document.getElementById('rho');
      const vEl = document.getElementById('v');
      const fBEl = document.getElementById('f_b');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const rhoVal = rhoEl.value.trim();
        const vVal = vEl.value.trim();
        const fBVal = fBEl.value.trim();

        const rhoNum = parseNum(rhoVal);
        const vNum = parseNum(vVal);
        const fBNum = parseNum(fBVal);

        const filled = [!isEmpty(rhoVal), !isEmpty(vVal), !isEmpty(fBVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate buoyant force (F_b = ρ*g*V)
        if(isEmpty(fBVal) && rhoNum !== null && vNum !== null){
          const g = 9.81; // gravity
          const buoyantForce = rhoNum * g * vNum;
          fBEl.value = formatNumber(buoyantForce);
          showResult(`قوة الطفو = ${formatNumber(buoyantForce)} N`);
          return;
        }

        // Calculate density (ρ = F_b / (g*V))
        if(isEmpty(rhoVal) && fBNum !== null && vNum !== null){
          if(vNum === 0){
            showResult('خطأ: الحجم لا يمكن أن يكون صفر');
            return;
          }
          const g = 9.81;
          const density = fBNum / (g * vNum);
          rhoEl.value = formatNumber(density);
          showResult(`كثافة السائل = ${formatNumber(density)} kg/m³`);
          return;
        }

        // Calculate volume (V = F_b / (ρ*g))
        if(isEmpty(vVal) && fBNum !== null && rhoNum !== null){
          if(rhoNum === 0){
            showResult('خطأ: الكثافة لا يمكن أن تكون صفر');
            return;
          }
          const g = 9.81;
          const volume = fBNum / (rhoNum * g);
          vEl.value = formatNumber(volume);
          showResult(`الحجم المغمور = ${formatNumber(volume)} m³`);
          return;
        }

        // all three provided -> validate
        if(rhoNum !== null && vNum !== null && fBNum !== null){
          const g = 9.81;
          const expectedFB = rhoNum * g * vNum;
          if(Math.abs(expectedFB - fBNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع F_b = ρ*g*V');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        rhoEl.value = '';
        vEl.value = '';
        fBEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [rhoEl, vEl, fBEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
