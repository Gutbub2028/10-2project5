<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب انزياح دوبلر</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="f0" type="text" placeholder="(Hz) التردد الأصلي"></input>
    <input id="v" type="text" placeholder="(m/s) سرعة المصدر"></input>
    <input id="c" type="text" placeholder="(m/s) سرعة الصوت" value="343"></input>
    <input id="delta_f" type="text" placeholder="(Hz) انزياح التردد"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const f0El = document.getElementById('f0');
      const vEl = document.getElementById('v');
      const cEl = document.getElementById('c');
      const deltaFEl = document.getElementById('delta_f');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const f0Val = f0El.value.trim();
        const vVal = vEl.value.trim();
        const cVal = cEl.value.trim() || '343';
        const deltaFVal = deltaFEl.value.trim();

        const f0Num = parseNum(f0Val);
        const vNum = parseNum(vVal);
        const cNum = parseNum(cVal);
        const deltaFNum = parseNum(deltaFVal);

        const filled = [!isEmpty(f0Val), !isEmpty(vVal), !isEmpty(deltaFVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate Doppler shift (Δf = f₀ * v / c)
        if(isEmpty(deltaFVal) && f0Num !== null && vNum !== null){
          if(cNum === 0){
            showResult('خطأ: سرعة الصوت لا يمكن أن تكون صفر');
            return;
          }
          const shift = f0Num * vNum / cNum;
          deltaFEl.value = formatNumber(shift);
          showResult(`انزياح التردد = ${formatNumber(shift)} Hz`);
          return;
        }

        // Calculate source velocity (v = Δf * c / f₀)
        if(isEmpty(vVal) && deltaFNum !== null && f0Num !== null){
          if(f0Num === 0){
            showResult('خطأ: التردد الأصلي لا يمكن أن يكون صفر');
            return;
          }
          const velocity = deltaFNum * cNum / f0Num;
          vEl.value = formatNumber(velocity);
          showResult(`سرعة المصدر = ${formatNumber(velocity)} m/s`);
          return;
        }

        // Calculate original frequency (f₀ = Δf * c / v)
        if(isEmpty(f0Val) && deltaFNum !== null && vNum !== null){
          if(vNum === 0){
            showResult('خطأ: سرعة المصدر لا يمكن أن تكون صفر');
            return;
          }
          const frequency = deltaFNum * cNum / vNum;
          f0El.value = formatNumber(frequency);
          showResult(`التردد الأصلي = ${formatNumber(frequency)} Hz`);
          return;
        }

        // all four provided -> validate
        if(f0Num !== null && vNum !== null && deltaFNum !== null){
          const expectedDeltaF = f0Num * vNum / cNum;
          if(Math.abs(expectedDeltaF - deltaFNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع Δf = f₀*v/c');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        f0El.value = '';
        vEl.value = '';
        cEl.value = '343';
        deltaFEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [f0El, vEl, cEl, deltaFEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
