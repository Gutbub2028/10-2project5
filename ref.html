<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
</head>
<body>
  <h2>حساب قانون الانعكاس</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="i" type="text" placeholder="(rad) زاوية السقوط"></input>
    <input id="r" type="text" placeholder="(rad) زاوية الانعكاس"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="reset" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const iEl = document.getElementById('i');
      const rEl = document.getElementById('r');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('reset');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const iVal = iEl.value.trim();
        const rVal = rEl.value.trim();

        const iNum = parseNum(iVal);
        const rNum = parseNum(rVal);

        const filled = [!isEmpty(iVal), !isEmpty(rVal)].filter(Boolean).length;
        if(filled < 1){
          showResult('الرجاء إدخال قيمة واحدة على الأقل.');
          return;
        }

        // Calculate reflection angle (r = i)
        if(isEmpty(rVal) && iNum !== null){
          rEl.value = formatNumber(iNum);
          showResult(`زاوية الانعكاس = ${formatNumber(iNum)} rad`);
          return;
        }

        // Calculate incidence angle (i = r)
        if(isEmpty(iVal) && rNum !== null){
          iEl.value = formatNumber(rNum);
          showResult(`زاوية السقوط = ${formatNumber(rNum)} rad`);
          return;
        }

        // both provided -> validate
        if(iNum !== null && rNum !== null){
          if(Math.abs(iNum - rNum) < 0.000001) {
            showResult('القيم صحيحة! زاوية السقوط = زاوية الانعكاس');
          } else {
            showResult('القيم غير متطابقة مع قانون الانعكاس i = r');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        iEl.value = '';
        rEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [iEl, rEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
