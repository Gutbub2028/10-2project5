<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسية</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حساب التوصيل الكهربائي</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب التوصيل الكهربائي: σ = 1/ρ</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="sigma" type="text" placeholder="(S/m) التوصيل الكهربائي"></input>
    <input id="rho" type="text" placeholder="(Ω·m) المقاومة النوعية"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="static.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const sigmaEl = document.getElementById('sigma');
      const rhoEl = document.getElementById('rho');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const sigmaVal = sigmaEl.value.trim();
        const rhoVal = rhoEl.value.trim();

        const sigmaNum = parseNum(sigmaVal);
        const rhoNum = parseNum(rhoVal);

        const filled = [!isEmpty(sigmaVal), !isEmpty(rhoVal)].filter(Boolean).length;
        if(filled < 1){
          showResult('الرجاء إدخال قيمة واحدة على الأقل.');
          return;
        }

        // Calculate conductivity (σ = 1/ρ)
        if(isEmpty(sigmaVal) && rhoNum !== null){
          if(rhoNum === 0){
            showResult('خطأ: المقاومة النوعية لا يمكن أن تكون صفر');
            return;
          }
          const conductivity = 1 / rhoNum;
          sigmaEl.value = formatNumber(conductivity);
          showResult(`التوصيل الكهربائي = ${formatNumber(conductivity)} S/m`);
          return;
        }

        // Calculate resistivity (ρ = 1/σ)
        if(isEmpty(rhoVal) && sigmaNum !== null){
          if(sigmaNum === 0){
            showResult('خطأ: التوصيل الكهربائي لا يمكن أن يكون صفر');
            return;
          }
          const resistivity = 1 / sigmaNum;
          rhoEl.value = formatNumber(resistivity);
          showResult(`المقاومة النوعية = ${formatNumber(resistivity)} Ω·m`);
          return;
        }

        // all two provided -> validate
        if(sigmaNum !== null && rhoNum !== null){
          const expectedSigma = 1 / rhoNum;
          if(Math.abs(expectedSigma - sigmaNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع σ = 1/ρ');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        sigmaEl.value = '';
        rhoEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [sigmaEl, rhoEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
 </script>
</body>
</html></style>
