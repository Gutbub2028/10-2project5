<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسية</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حساب المعزول الكهربائي</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2, h3 {
      text-align: center;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    div {
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 150px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب المعزول الكهربائي</h2>

  <h3>1. السعة مع المعزول: C = ε₀ × εᵣ × A / d</h3>
  <div>
    <label for="c_dielectric">السعة:</label>
    <input id="c_dielectric" type="text" placeholder="(F) السعة">
    <label for="epsilon_r_dielectric">النسبة الديالكتريكية:</label>
    <input id="epsilon_r_dielectric" type="text" placeholder="(εᵣ) النسبة الديالكتريكية">
    <label for="a_dielectric">المساحة:</label>
    <input id="a_dielectric" type="text" placeholder="(m²) المساحة">
    <label for="d_dielectric">المسافة:</label>
    <input id="d_dielectric" type="text" placeholder="(m) المسافة">
    <input id="calc_dielectric" type="button" value="حساب">
  </div>

  <h3>2. الشحنة المخزنة: Q = C × V</h3>
  <div>
    <label for="q_dielectric">الشحنة:</label>
    <input id="q_dielectric" type="text" placeholder="(C) الشحنة">
    <label for="c_charge">السعة:</label>
    <input id="c_charge" type="text" placeholder="(F) السعة">
    <label for="v_charge">الجهد:</label>
    <input id="v_charge" type="text" placeholder="(V) الجهد">
    <input id="calc_charge" type="button" value="حساب">
  </div>

  <h3>3. الطاقة المخزنة: E = 0.5 × C × V²</h3>
  <div>
    <label for="e_dielectric">الطاقة:</label>
    <input id="e_dielectric" type="text" placeholder="(J) الطاقة">
    <label for="c_energy_dielectric">السعة:</label>
    <input id="c_energy_dielectric" type="text" placeholder="(F) السعة">
    <label for="v_energy_dielectric">الجهد:</label>
    <input id="v_energy_dielectric" type="text" placeholder="(V) الجهد">
    <input id="calc_energy_dielectric" type="button" value="حساب">
  </div>

  <input id="r" type="button" value="إعادة تعيين الكل">

  <a href="static.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const cDielectricEl = document.getElementById('c_dielectric');
      const epsilonRDielectricEl = document.getElementById('epsilon_r_dielectric');
      const aDielectricEl = document.getElementById('a_dielectric');
      const dDielectricEl = document.getElementById('d_dielectric');
      const calcDielectricBtn = document.getElementById('calc_dielectric');

      const qDielectricEl = document.getElementById('q_dielectric');
      const cChargeEl = document.getElementById('c_charge');
      const vChargeEl = document.getElementById('v_charge');
      const calcChargeBtn = document.getElementById('calc_charge');

      const eDielectricEl = document.getElementById('e_dielectric');
      const cEnergyDielectricEl = document.getElementById('c_energy_dielectric');
      const vEnergyDielectricEl = document.getElementById('v_energy_dielectric');
      const calcEnergyDielectricBtn = document.getElementById('calc_energy_dielectric');

      const rBtn = document.getElementById('r');

      const epsilon0 = 8.85e-12; // Permittivity of free space

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function computeDielectric(){
        const cDielectricVal = cDielectricEl.value.trim();
        const epsilonRDielectricVal = epsilonRDielectricEl.value.trim();
        const aDielectricVal = aDielectricEl.value.trim();
        const dDielectricVal = dDielectricEl.value.trim();

        const cDielectricNum = parseNum(cDielectricVal);
        const epsilonRDielectricNum = parseNum(epsilonRDielectricVal);
        const aDielectricNum = parseNum(aDielectricVal);
        const dDielectricNum = parseNum(dDielectricVal);

        const filled = [!isEmpty(cDielectricVal), !isEmpty(epsilonRDielectricVal), !isEmpty(aDielectricVal), !isEmpty(dDielectricVal)].filter(Boolean).length;
        if(filled < 3){
          showResult('الرجاء إدخال ثلاث قيم على الأقل لحساب الرابعة.');
          return;
        }

        // Calculate capacitance (C = ε₀ × εᵣ × A / d)
        if(isEmpty(cDielectricVal) && epsilonRDielectricNum !== null && aDielectricNum !== null && dDielectricNum !== null){
          if(dDielectricNum === 0){
            showResult('خطأ: المسافة لا يمكن أن تكون صفر');
            return;
          }
          const capacitance = epsilon0 * epsilonRDielectricNum * aDielectricNum / dDielectricNum;
          cDielectricEl.value = formatNumber(capacitance);
          showResult(`السعة = ${formatNumber(capacitance)} F`);
          return;
        }

        // Calculate dielectric constant (εᵣ = C × d / (ε₀ × A))
        if(isEmpty(epsilonRDielectricVal) && cDielectricNum !== null && aDielectricNum !== null && dDielectricNum !== null){
          if(epsilon0 * aDielectricNum === 0){
            showResult('خطأ: المساحة لا يمكن أن تكون صفر');
            return;
          }
          const epsilonR = cDielectricNum * dDielectricNum / (epsilon0 * aDielectricNum);
          epsilonRDielectricEl.value = formatNumber(epsilonR);
          showResult(`النسبة الديالكتريكية = ${formatNumber(epsilonR)}`);
          return;
        }

        // Calculate area (A = C × d / (ε₀ × εᵣ))
        if(isEmpty(aDielectricVal) && cDielectricNum !== null && epsilonRDielectricNum !== null && dDielectricNum !== null){
          if(epsilon0 * epsilonRDielectricNum === 0){
            showResult('خطأ: النسبة الديالكتريكية لا يمكن أن تكون صفر');
            return;
          }
          const area = cDielectricNum * dDielectricNum / (epsilon0 * epsilonRDielectricNum);
          aDielectricEl.value = formatNumber(area);
          showResult(`المساحة = ${formatNumber(area)} m²`);
          return;
        }

        // Calculate distance (d = ε₀ × εᵣ × A / C)
        if(isEmpty(dDielectricVal) && cDielectricNum !== null && epsilonRDielectricNum !== null && aDielectricNum !== null){
          if(cDielectricNum === 0){
            showResult('خطأ: السعة لا يمكن أن تكون صفر');
            return;
          }
          const distance = epsilon0 * epsilonRDielectricNum * aDielectricNum / cDielectricNum;
          dDielectricEl.value = formatNumber(distance);
          showResult(`المسافة = ${formatNumber(distance)} m`);
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      function computeCharge(){
        const qDielectricVal = qDielectricEl.value.trim();
        const cChargeVal = cChargeEl.value.trim();
        const vChargeVal = vChargeEl.value.trim();

        const qDielectricNum = parseNum(qDielectricVal);
        const cChargeNum = parseNum(cChargeVal);
        const vChargeNum = parseNum(vChargeVal);

        const filled = [!isEmpty(qDielectricVal), !isEmpty(cChargeVal), !isEmpty(vChargeVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate charge (Q = C × V)
        if(isEmpty(qDielectricVal) && cChargeNum !== null && vChargeNum !== null){
          const charge = cChargeNum * vChargeNum;
          qDielectricEl.value = formatNumber(charge);
          showResult(`الشحنة = ${formatNumber(charge)} C`);
          return;
        }

        // Calculate capacitance (C = Q / V)
        if(isEmpty(cChargeVal) && qDielectricNum !== null && vChargeNum !== null){
          if(vChargeNum === 0){
            showResult('خطأ: الجهد لا يمكن أن يكون صفر');
            return;
          }
          const capacitance = qDielectricNum / vChargeNum;
          cChargeEl.value = formatNumber(capacitance);
          showResult(`السعة = ${formatNumber(capacitance)} F`);
          return;
        }

        // Calculate voltage (V = Q / C)
        if(isEmpty(vChargeVal) && qDielectricNum !== null && cChargeNum !== null){
          if(cChargeNum === 0){
            showResult('خطأ: السعة لا يمكن أن تكون صفر');
            return;
          }
          const voltage = qDielectricNum / cChargeNum;
          vChargeEl.value = formatNumber(voltage);
          showResult(`الجهد = ${formatNumber(voltage)} V`);
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      function computeEnergyDielectric(){
        const eDielectricVal = eDielectricEl.value.trim();
        const cEnergyDielectricVal = cEnergyDielectricEl.value.trim();
        const vEnergyDielectricVal = vEnergyDielectricEl.value.trim();

        const eDielectricNum = parseNum(eDielectricVal);
        const cEnergyDielectricNum = parseNum(cEnergyDielectricVal);
        const vEnergyDielectricNum = parseNum(vEnergyDielectricVal);

        const filled = [!isEmpty(eDielectricVal), !isEmpty(cEnergyDielectricVal), !isEmpty(vEnergyDielectricVal)].filter(Boolean).length;
        if(filled < 2){
          showResult('الرجاء إدخال قيمتين على الأقل لحساب الثالثة.');
          return;
        }

        // Calculate energy (E = 0.5 × C × V²)
        if(isEmpty(eDielectricVal) && cEnergyDielectricNum !== null && vEnergyDielectricNum !== null){
          const energy = 0.5 * cEnergyDielectricNum * vEnergyDielectricNum * vEnergyDielectricNum;
          eDielectricEl.value = formatNumber(energy);
          showResult(`الطاقة = ${formatNumber(energy)} J`);
          return;
        }

        // Calculate capacitance (C = 2 × E / V²)
        if(isEmpty(cEnergyDielectricVal) && eDielectricNum !== null && vEnergyDielectricNum !== null){
          if(vEnergyDielectricNum === 0){
            showResult('خطأ: الجهد لا يمكن أن يكون صفر');
            return;
          }
          const capacitance = 2 * eDielectricNum / (vEnergyDielectricNum * vEnergyDielectricNum);
          cEnergyDielectricEl.value = formatNumber(capacitance);
          showResult(`السعة = ${formatNumber(capacitance)} F`);
          return;
        }

        // Calculate voltage (V = sqrt(2 × E / C))
        if(isEmpty(vEnergyDielectricVal) && eDielectricNum !== null && cEnergyDielectricNum !== null){
          if(cEnergyDielectricNum === 0){
            showResult('خطأ: السعة لا يمكن أن تكون صفر');
            return;
          }
          const voltage = Math.sqrt(2 * eDielectricNum / cEnergyDielectricNum);
          vEnergyDielectricEl.value = formatNumber(voltage);
          showResult(`الجهد = ${formatNumber(voltage)} V`);
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      calcDielectricBtn.addEventListener('click', computeDielectric);
      calcChargeBtn.addEventListener('click', computeCharge);
      calcEnergyDielectricBtn.addEventListener('click', computeEnergyDielectric);

      rBtn.addEventListener('click', function(){
        cDielectricEl.value = '';
        epsilonRDielectricEl.value = '';
        aDielectricEl.value = '';
        dDielectricEl.value = '';
        qDielectricEl.value = '';
        cChargeEl.value = '';
        vChargeEl.value = '';
        eDielectricEl.value = '';
        cEnergyDielectricEl.value = '';
        vEnergyDielectricEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [cDielectricEl, epsilonRDielectricEl, aDielectricEl, dDielectricEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            computeDielectric();
          }
        });
      });

      [qDielectricEl, cChargeEl, vChargeEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            computeCharge();
          }
        });
      });

      [eDielectricEl, cEnergyDielectricEl, vEnergyDielectricEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            computeEnergyDielectric();
          }
        });
      });
    })();
 </script>
</body>
</html></style>
