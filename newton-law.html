<!doctype html>
<html lang="ar">
    <header>
        <a href="calcu.html">الصفحة الرئيسة</a>
    </header>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ديناميكا و فروعها</title>
  <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
  <script defer src="https://pyscript.net/latest/pyscript.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    header a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      width: 200px;
    }
    input[type="button"] {
      padding: 10px 20px;
      margin: 5px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    input[type="button"]:hover {
      background: #ff5252;
      transform: scale(1.05);
    }
    body > a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      transition: background 0.3s;
    }
    body > a:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    #calc-result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>حساب قانون نيوتن العام</h2>
<p>ادخل المعطيات و اذا تريد حسابه اجعله فارغاً
    <input id="f" type="text" placeholder="(N) القوة"></input>
    <input id="g" type="text" placeholder="(N·m²/kg²) ثابت الجاذبية"></input>
    <input id="m1" type="text" placeholder="(kg) الكتلة الأولى"></input>
    <input id="m2" type="text" placeholder="(kg) الكتلة الثانية"></input>
    <input id="r" type="text" placeholder="(m) المسافة"></input>
    <input id="s" type="button" value="تاكيد">
    <input id="r" type="button" value="اعادة">
</p>
<a href="dynamic.html">الرجوع الى الصفحة السابقة</a>
 <script>
    (function(){
      // consistent element variable names
      const fEl = document.getElementById('f');
      const gEl = document.getElementById('g');
      const m1El = document.getElementById('m1');
      const m2El = document.getElementById('m2');
      const rEl = document.getElementById('r');
      const sBtn = document.getElementById('s');
      const rBtn = document.getElementById('r');

      function isEmpty(x){
        return x === null || x === undefined || x.toString().trim() === '';
      }

      function showResult(msg){
        let old = document.getElementById('calc-result');
        if(old) old.remove();
        const p = document.createElement('p');
        p.id = 'calc-result';
        p.textContent = msg;
        p.style.fontWeight = 'bold';
        p.style.marginTop = '8px';
        document.body.appendChild(p);
      }

      function parseNum(str){
        const n = Number(str);
        return Number.isFinite(n) ? n : null;
      }

      function formatNumber(n){
        if(!Number.isFinite(n)) return n;
        // round to max 6 decimal places, remove trailing zeros
        return parseFloat(n.toFixed(6)).toString();
      }

      function compute(){
        const fVal = fEl.value.trim();
        const gVal = gEl.value.trim();
        const m1Val = m1El.value.trim();
        const m2Val = m2El.value.trim();
        const rVal = rEl.value.trim();

        const fNum = parseNum(fVal);
        const gNum = parseNum(gVal);
        const m1Num = parseNum(m1Val);
        const m2Num = parseNum(m2Val);
        const rNum = parseNum(rVal);

        const filled = [!isEmpty(fVal), !isEmpty(gVal), !isEmpty(m1Val), !isEmpty(m2Val), !isEmpty(rVal)].filter(Boolean).length;
        if(filled < 4){
          showResult('الرجاء إدخال أربع قيم على الأقل لحساب الخامسة.');
          return;
        }

        // Calculate gravitational force (F = G*m1*m2/r²)
        if(isEmpty(fVal) && gNum !== null && m1Num !== null && m2Num !== null && rNum !== null){
          if(rNum === 0){
            showResult('خطأ: المسافة لا يمكن أن تكون صفر');
            return;
          }
          const force = (gNum * m1Num * m2Num) / (rNum * rNum);
          fEl.value = formatNumber(force);
          showResult(`القوة = ${formatNumber(force)} N`);
          return;
        }

        // Calculate gravitational constant (G = F*r²/(m1*m2))
        if(isEmpty(gVal) && fNum !== null && m1Num !== null && m2Num !== null && rNum !== null){
          if(m1Num === 0 || m2Num === 0){
            showResult('خطأ: الكتل لا يمكن أن تكون صفر');
            return;
          }
          const gConst = (fNum * rNum * rNum) / (m1Num * m2Num);
          gEl.value = formatNumber(gConst);
          showResult(`ثابت الجاذبية = ${formatNumber(gConst)} N·m²/kg²`);
          return;
        }

        // Calculate mass 1 (m1 = F*r²/(G*m2))
        if(isEmpty(m1Val) && fNum !== null && gNum !== null && m2Num !== null && rNum !== null){
          if(gNum === 0 || m2Num === 0){
            showResult('خطأ: ثابت الجاذبية أو الكتلة الثانية لا يمكن أن تكون صفر');
            return;
          }
          const mass1 = (fNum * rNum * rNum) / (gNum * m2Num);
          m1El.value = formatNumber(mass1);
          showResult(`الكتلة الأولى = ${formatNumber(mass1)} kg`);
          return;
        }

        // Calculate mass 2 (m2 = F*r²/(G*m1))
        if(isEmpty(m2Val) && fNum !== null && gNum !== null && m1Num !== null && rNum !== null){
          if(gNum === 0 || m1Num === 0){
            showResult('خطأ: ثابت الجاذبية أو الكتلة الأولى لا يمكن أن تكون صفر');
            return;
          }
          const mass2 = (fNum * rNum * rNum) / (gNum * m1Num);
          m2El.value = formatNumber(mass2);
          showResult(`الكتلة الثانية = ${formatNumber(mass2)} kg`);
          return;
        }

        // Calculate distance (r = √(G*m1*m2/F))
        if(isEmpty(rVal) && fNum !== null && gNum !== null && m1Num !== null && m2Num !== null){
          if(fNum === 0){
            showResult('خطأ: القوة لا يمكن أن تكون صفر');
            return;
          }
          const distance = Math.sqrt((gNum * m1Num * m2Num) / fNum);
          rEl.value = formatNumber(distance);
          showResult(`المسافة = ${formatNumber(distance)} m`);
          return;
        }

        // all five provided -> validate
        if(fNum !== null && gNum !== null && m1Num !== null && m2Num !== null && rNum !== null){
          const expectedF = (gNum * m1Num * m2Num) / (rNum * rNum);
          if(Math.abs(expectedF - fNum) < 0.000001) {
            showResult('القيم صحيحة!');
          } else {
            showResult('القيم غير متطابقة مع F = G*m1*m2/r²');
          }
          return;
        }

        showResult('خطأ: بيانات غير كافية أو غير صحيحة.');
      }

      sBtn.addEventListener('click', compute);
      rBtn.addEventListener('click', function(){
        fEl.value = '';
        gEl.value = '';
        m1El.value = '';
        m2El.value = '';
        rEl.value = '';
        const old = document.getElementById('calc-result'); if(old) old.remove();
      });

      // allow Enter to compute when focused inside inputs
      [fEl, gEl, m1El, m2El, rEl].forEach(function(el){
        el.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            compute();
          }
        });
      });
    })();
  </script></style>
